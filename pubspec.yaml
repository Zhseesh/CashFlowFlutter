name: cashflow
description: Aplikasi pengelola arus kas & analisis keuangan
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  pdf: ^3.11.1
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  fl_chart: ^0.68.0
  open_filex: ^4.6.0
  better_download_saver: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# ── Konfigurasi Icon ──────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

  # Ikon adaptif Android 8+ (opsional, tapi disarankan)
  adaptive_icon_background: "#115E59"
  adaptive_icon_foreground: "assets/icon/icon.png"
