name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # android/ sengaja tidak disimpan di repo (versi Termux berisi pengaturan
      # khusus Termux). Dibuat bersih di sini; lib/ dan pubspec.yaml tetap milik repo.
      - name: Generate android/ project
        run: |
          flutter create --org com.zsheesh --project-name cashflow --platforms android .
          rm -f test/widget_test.dart
          sed -i 's/android:label="cashflow"/android:label="Cash Flow"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # Tidak memblokir pembuatan APK; hasilnya tetap terlihat di log.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cashflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

