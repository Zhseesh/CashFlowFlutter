name: cashflow
description: Aplikasi pengelola arus kas & analisis keuangan
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Icons
  material_ui: ^1.10.0        # <-- TAMBAHAN: Wajib karena kita import langsung
  cupertino_icons: ^1.0.6
  google_fonts: ^9.0.0
  fl_chart: ^1.3.0

  # Database & File
  sqflite: ^2.4.5
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.5.6

  # Export & Sharing
  pdf: ^3.13.1
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  open_filex: ^5.0.0

  # Networking & Utils
  intl: ^0.20.3
  http: ^1.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true