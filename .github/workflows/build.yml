name: Build Android APK

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # ── CACHE GRADLE (DIPINDAHKAN KE SINI AGAR MEMPERCEPAT BUILD) ──
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── SIGNING: Decode keystore dari secret ──────────────────
      - name: Decode Keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          CLEAN_B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$CLEAN_B64" ]; then
            echo "ERROR: secret KEYSTORE_BASE64 kosong."
            exit 1
          fi
          printf '%s' "$CLEAN_B64" | openssl base64 -d -A > android/app/keystore.jks
          SIZE=$(stat -c%s android/app/keystore.jks)
          echo "keystore.jks size = $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: keystore.jks terlalu kecil, decode gagal."
            exit 1
          fi
          MAGIC=$(head -c 4 android/app/keystore.jks | xxd -p)
          echo "keystore magic = $MAGIC"
          if [[ "$MAGIC" == feedfeed* ]]; then
            echo "Keystore format: JKS"
          elif [[ "$MAGIC" == 30* ]]; then
            echo "Keystore format: PKCS12"
          else
            echo "ERROR: file bukan JKS/PKCS12 valid. Periksa secret KEYSTORE_BASE64."
            exit 1
          fi

      - name: Create key.properties
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Split-per-ABI APKs (release)
        run: flutter build apk --release --split-per-abi

      # ── CLEANUP: Hapus keystore dari workspace ────────────────
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cashflow-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}